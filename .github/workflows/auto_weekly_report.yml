name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Saturday at 5:00 AM IST (Friday 23:30 UTC)
    - cron: '30 23 * * 5'

  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping runs from pushing simultaneously.
concurrency:
  group: weekly-progress-report
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PDF & Graph Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab matplotlib

      - name: Generate Weekly PDF Report
        run: |
          python generate_report.py weekly

      - name: Move PDF to Weekly Reports Directory & Commit to Repository
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p weekly_reports

          # Find generated PDFs in the repository root.
          shopt -s nullglob
          reports=( *_Weekly_Progress_Report_Form-3_*.pdf )

          # Move matching PDFs into weekly_reports/.
          if [ ${#reports[@]} -gt 0 ]; then
            for report in "${reports[@]}"; do
              mv -- "$report" weekly_reports/
            done
          fi

          # Verify that a PDF exists in the destination directory.
          if ! find weekly_reports -maxdepth 1 -type f -name '*.pdf' -print -quit | grep -q .; then
            echo "ERROR: No PDF found in the repository root or weekly_reports/."
            echo "Check the output filename and location in generate_report.py."
            echo "Files in the repository root:"
            ls -la
            exit 1
          fi

          # Configure Git identity.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage reports.
          git add -f weekly_reports/

          if git diff --cached --quiet; then
            echo "No new changes or reports to commit."
            exit 0
          fi

          # Commit the generated report.
          git commit -m "docs: archive Form-3 weekly progress report [skip ci]"

          # Synchronize with the latest remote main branch.
          git fetch origin main
          git rebase origin/main

          # Push the rebased commit.
          git push origin HEAD:main
